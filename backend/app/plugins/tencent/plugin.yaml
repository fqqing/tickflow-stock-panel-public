# 腾讯行情分钟数据源插件 (只提供 minute 数据集)
#
# 为什么单独做一个插件:
# 现用的 stocksdk(东方财富) 分钟接口已基本失效 —— bridge.mjs 的 opMinute 注释记载
# 「分钟接口存在十几秒级间歇性空返回, 单发成功率约 1/5」, 于是配了
# retries:4/backoff:2 (每只票最坏退避 6s), 40 只一批 / 并发 6 ≈ 7 轮, 单批理论最坏
# 315s 必然打满 provider 侧的 180s 超时。2026-09-28 实测单只 m1 = 27.6s 后仍 0 根。
# 腾讯 mkline 同口径实测 0.11~0.20s / 只, 快约三个数量级。
#
# runtime: none —— 纯 Python 标准库 urllib + 线程池并发, 无需额外安装。

name: tencent
display_name: "腾讯行情(分钟K)"
runtime: none
entry: app.plugins.tencent.provider:TencentMinuteProvider
check: app.plugins.tencent.provider:availability
datasets: [minute]
description: "腾讯 mkline 分钟K。沪深全支持、零鉴权、约 90~160 只/秒。单次上限约 482 根 bar(m1≈2 交易日, m5≈11 交易日), 不支持 beg/end 区间, 不支持批量。北交所无分钟数据(自动回落到 stock-sdk)。"
install_hint: "无需安装依赖与 token。选中它作为「分钟数据源」即可。注意: 单次最多约 482 根 bar, 且腾讯不提供北交所分钟数据。"
